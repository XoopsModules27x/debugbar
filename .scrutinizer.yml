# language: php
build:
  nodes:
    analysis:
      environment:
        php:
          version: '8.2'
      dependencies:
        after:
          # The following installs the most recent XOOPS CMS version, you might want
          # to install a specific release tag or branch instead.
          - git clone --depth=1 https://github.com/XOOPS/XoopsCore27
          # - git clone --depth=1 https://github.com/mambax7/tag
          - git clone --depth=1 https://github.com/mambax7/mtools
      project_setup:
        override: true
      tests:
        override:
          - php-scrutinizer-run --enable-security-analysis
    # Second node, so the regression suite actually runs here: the analysis node
    # above sets `project_setup: override: true`, which suppresses the inferred
    # composer install, leaving it no vendor/ to run PHPUnit from. This node keeps
    # the default setup and therefore does have one.
    #
    # Pinned to 8.2, NOT the 8.4 this node asked for when it was disabled — that
    # version is what failed, during environment setup rather than in the tests.
    # 8.2 is the module's documented floor and is the version the analysis node
    # already builds on, so it is known-good on this platform. Newer runtimes are
    # not lost: CI covers 8.2 through 8.5 on every push, and this node exists to
    # run the suite at all, not to be the place new PHP versions are proven.
    tests:
      environment:
        php:
          version: '8.2'
      tests:
        override:
          - composer test
filter:
  dependency_paths:
    - XoopsCore27/*
    # - tag/*
    - mtools/*
  excluded_paths:
    - 'tests/'
    - 'extras/'
    - 'docs/'
checks:
  php: true
